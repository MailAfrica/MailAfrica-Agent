name: Deploy to Coolify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -p 4444 camel@13.140.167.42 'bash /home/camel/deploy/deploy.sh mailafrica-agent'